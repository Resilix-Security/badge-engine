services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "pnpm install && pnpm style-dictionary && pnpm dev"
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "3100:3100"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    depends_on:
      mongodb-init:
        condition: service_completed_successfully

  mongodb:
    image: mongo:7.0
    command: ["--replSet", "rs0"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb-init:
    image: mongo:7.0
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --host
      - mongodb
      - --quiet
      - --eval
      - "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}) }"

  status:
    image: digitalcredentials/status-service:0.1.0
    working_dir: /app
    command: node server.js
    ports:
      - "4008:4008"
    environment:
      CRED_STATUS_SERVICE: ${CRED_STATUS_SERVICE:-}
      CRED_STATUS_REPO_OWNER: ${CRED_STATUS_REPO_OWNER:-}
      CRED_STATUS_REPO_NAME: ${CRED_STATUS_REPO_NAME:-}
      CRED_STATUS_META_REPO_NAME: ${CRED_STATUS_META_REPO_NAME:-}
      CRED_STATUS_ACCESS_TOKEN: ${CRED_STATUS_ACCESS_TOKEN:-}
      CRED_STATUS_DID_SEED: ${CRED_STATUS_DID_SEED:-}
    profiles:
      - status

volumes:
  mongodb_data:
  app_node_modules:
  app_next:
